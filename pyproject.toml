[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "preclone-tesis"
version = "0.1.0"
description = "Detector local de instrucciones adversariales en Markdown"
requires-python = ">=3.11"
dependencies = ["scikit-learn==1.6.1", "joblib==1.4.2"]

[project.optional-dependencies]
evaluacion = ["duckdb==1.5.6"]
mcp = ["mcp==1.26.0"]

[project.scripts]
preclone = "preclone.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
